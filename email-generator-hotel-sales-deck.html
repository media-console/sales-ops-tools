<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Hotel Email Generator - Sales Deck</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--blue:#1159f8;--navy:#101828;--muted:#667085;--line:#d0d5dd;--bg:#f2f4f7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,"Noto Sans Thai",Tahoma,sans-serif;color:var(--navy)}
.app{display:grid;grid-template-columns:440px minmax(0,1fr);gap:24px;padding:24px;align-items:start}
.panel{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:22px;position:sticky;top:16px;box-shadow:0 10px 30px rgba(16,24,40,.06)}
.panel h1{font-size:25px;margin:0 0 8px}.intro{font-size:15px;line-height:1.6;color:var(--muted);margin:0 0 20px}
.section-title{font-size:13px;font-weight:800;color:var(--blue);letter-spacing:.8px;text-transform:uppercase;margin:24px 0 6px;border-top:1px solid #eaecf0;padding-top:20px}.section-title.first{border:0;padding-top:0;margin-top:0}
label{display:block;font-size:14px;font-weight:700;color:#344054;margin:15px 0 7px}input,.signature-input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 13px;font-size:15px;font-family:inherit;color:#101828;outline:none;background:#fff}input:focus,.signature-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(17,89,248,.1)}.signature-input{min-height:135px;line-height:1.6;overflow:auto}.signature-input:empty:before{content:attr(data-placeholder);color:#98a2b3}
.logo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.logo-upload{background:#f8fafc;border:1px solid #e4e7ec;border-radius:11px;padding:11px}.logo-upload.full{grid-column:1/-1}.logo-upload label{margin:0 0 7px;font-size:13px}.logo-upload input{padding:7px;font-size:12px;background:#fff}.logo-note{font-size:13px;line-height:1.55;color:#667085;margin:10px 0 0}
button{width:100%;border:0;border-radius:11px;padding:13px 14px;font-size:14px;font-weight:700;cursor:pointer;margin-top:12px;font-family:inherit}.primary{background:var(--blue);color:#fff}.secondary{background:#101828;color:#fff}.tertiary{background:#eaf0ff;color:#1246b8}.button-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.button-row button{margin-top:10px}.status{font-size:14px;color:#475467;margin-top:10px;min-height:20px;line-height:1.5}
.preview-area{min-width:0}.subject-card{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:0 6px 20px rgba(16,24,40,.04)}.subject-label{font-size:11px;font-weight:800;color:var(--blue);letter-spacing:.8px;white-space:nowrap}#emailSubject{font-size:14px;font-weight:700;color:#1d2939;flex:1;min-width:0}.copy-subject{width:auto;margin:0;padding:8px 12px;background:#eaf0ff;color:#1246b8;font-size:12px;white-space:nowrap}.preview-wrap{background:#e9eef5;padding:20px;border-radius:18px;overflow:auto;min-height:700px}
@media(max-width:900px){.app{grid-template-columns:1fr;padding:14px}.panel{position:static}.preview-wrap{padding:10px}.subject-card{align-items:flex-start;flex-wrap:wrap}.copy-subject{margin-left:auto}}
</style>
</head>
<body>
<div class="app">
 <aside class="panel">
  <h1>Hotel Follow-up Email</h1><p class="intro">สร้างอีเมลภาษาไทยสำหรับส่ง Company Deck หลังจากโทรแนะนำบริการกับโรงแรม</p>
  <div class="section-title first">ข้อมูลผู้รับ</div>
  <label for="recipientName">ชื่อลูกค้า</label><input id="recipientName" value="คุณติ๊ก" placeholder="เช่น คุณติ๊ก">
  <label for="hotelName">ชื่อโรงแรม</label><input id="hotelName" value="[ชื่อโรงแรม]" placeholder="เช่น Hotel ABC Bangkok">
  <div class="section-title">ข้อมูลเอกสาร</div>
  <label for="deckLink">ลิงก์ Hotel Performance Marketing Deck</label><input id="deckLink" value="https://insert-deck-link-here.com">
  <div class="section-title">โลโก้ในภาพ</div>
  <div class="logo-grid">
   <div class="logo-upload full"><label for="logoMedia">Media Console — Header</label><input id="logoMedia" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" onchange="loadLogo('media',event)"></div>
   <div class="logo-upload"><label for="logoGoogle">Google Ads</label><input id="logoGoogle" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" onchange="loadLogo('google',event)"></div>
   <div class="logo-upload"><label for="logoMeta">Meta</label><input id="logoMeta" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" onchange="loadLogo('meta',event)"></div>
   <div class="logo-upload"><label for="logoTikTok">TikTok</label><input id="logoTikTok" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" onchange="loadLogo('tiktok',event)"></div>
   <div class="logo-upload"><label for="logoXPO">KNOREX XPO</label><input id="logoXPO" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" onchange="loadLogo('xpo',event)"></div>
   <div class="logo-upload"><label for="logoTripadvisor">Tripadvisor</label><input id="logoTripadvisor" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" onchange="loadLogo('tripadvisor',event)"></div>
   <div class="logo-upload"><label for="logoSkyscanner">Skyscanner</label><input id="logoSkyscanner" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" onchange="loadLogo('skyscanner',event)"></div>
   <div class="logo-upload"><label for="logoFlightradar">Flightradar24</label><input id="logoFlightradar" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" onchange="loadLogo('flightradar',event)"></div>
  </div>
  <p class="logo-note">แนะนำไฟล์ PNG พื้นหลังโปร่งใส ขนาดไม่เกิน 500 KB หากยังไม่อัปโหลด ระบบจะแสดงโลโก้มาตรฐานเดิม</p>
  <div class="section-title">ข้อมูลผู้ส่ง</div>
  <label for="senderName">ชื่อผู้ส่ง</label><input id="senderName" value="[ชื่อผู้ส่ง]" placeholder="เช่น ดาว">
  <label for="contactPhone">เบอร์ติดต่อ</label><input id="contactPhone" value="090 993 9461" placeholder="เช่น 090 993 9461">
  <label for="senderSignature">Email Signature</label>
  <div id="senderSignature" class="signature-input" contenteditable="true" data-placeholder="คัดลอก Email Signature แล้ววางที่นี่">[วาง Email Signature ที่นี่]</div>
  <button class="primary" onclick="renderEmail()">สร้างตัวอย่างอีเมล</button>
  <button class="secondary" onclick="copyEmail()">คัดลอกอีเมลสำหรับ Outlook</button>
  <div class="button-row"><button class="tertiary" onclick="saveJSON()">บันทึก JSON</button><button class="tertiary" onclick="document.getElementById('jsonFile').click()">เปิด JSON</button></div>
  <input id="jsonFile" type="file" accept="application/json,.json" hidden onchange="loadJSON(event)"><div id="status" class="status" aria-live="polite"></div>
 </aside>
 <main class="preview-area">
  <div class="subject-card"><div class="subject-label">SUBJECT</div><div id="emailSubject"></div><button class="copy-subject" onclick="copySubject()">คัดลอก Subject</button></div>
  <div class="preview-wrap"><div id="emailPreview" contenteditable="true"></div></div>
 </main>
</div>

function serviceRow(n,title,text){return `<tr><td width="28" valign="top" style="width:28px;padding:2px 0 15px;"><table width="22" height="22" cellpadding="0" cellspacing="0" border="0" role="presentation" style="width:22px;height:22px;border-collapse:separate;"><tr><td width="22" height="22" align="center" valign="middle" bgcolor="#1159f8" style="width:22px;height:22px;line-height:22px;mso-line-height-rule:exactly;text-align:center;border-radius:11px;background:#1159f8;color:#fff;font-size:11px;font-weight:700;">${n}</td></tr></table></td><td valign="top" style="padding:0 0 15px 10px;font-size:16px;line-height:1.65;color:#475467;"><strong style="color:#1d2939;">${title}:</strong> ${text}</td></tr>`}
function setStatus(message,isError){const el=document.getElementById('status');el.textContent=message||'';el.style.color=isError?'#b42318':'#475467'}
function safeFilename(v){return String(v||'hotel').trim().replace(/[^a-z0-9ก-๙-_]+/gi,'-').replace(/^-+|-+$/g,'').toLowerCase()||'hotel'}
async function copyEmail(){try{const el=document.getElementById('emailPreview');if(navigator.clipboard&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([el.innerHTML],{type:'text/html'}),'text/plain':new Blob([el.innerText],{type:'text/plain'})})])}else{const r=document.createRange();r.selectNodeContents(el);const s=window.getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy');s.removeAllRanges()}setStatus('คัดลอกอีเมลแล้ว สามารถนำไปวางใน Outlook ได้ทันที')}catch(err){console.error(err);setStatus('ไม่สามารถคัดลอกอีเมลได้ กรุณาเลือกจากตัวอย่างและคัดลอกด้วยตนเอง',true)}}
async function copySubject(){try{await navigator.clipboard.writeText(document.getElementById('emailSubject').textContent);setStatus('คัดลอก Subject แล้ว')}catch(_){setStatus('ไม่สามารถคัดลอก Subject ได้',true)}}
function saveJSON(){try{const p={version:5,savedAt:new Date().toISOString(),senderSignature:document.getElementById('senderSignature').innerHTML,logoData};['recipientName','hotelName','deckLink','senderName','contactPhone'].forEach(id=>p[id]=value(id));const b=new Blob([JSON.stringify(p,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=safeFilename(p.hotelName)+'-thai-follow-up-email.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);setStatus('บันทึก JSON พร้อมโลโก้แล้ว')}catch(e){setStatus('ไม่สามารถบันทึก JSON: '+e.message,true)}}
function loadJSON(event){const f=event.target.files&&event.target.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{try{const p=JSON.parse(e.target.result);if(!p||typeof p!=='object')throw new Error('รูปแบบ JSON ไม่ถูกต้อง');['recipientName','hotelName','deckLink','senderName','contactPhone'].forEach(id=>{if(p[id]!==undefined)document.getElementById(id).value=p[id]});if(p.senderSignature!==undefined)document.getElementById('senderSignature').innerHTML=p.senderSignature;if(p.logoData&&typeof p.logoData==='object')logoData=p.logoData;renderEmail();setStatus('เปิด JSON พร้อมข้อมูลและโลโก้แล้ว')}catch(err){setStatus('ไม่สามารถเปิด JSON: '+err.message,true)}finally{event.target.value=''}};r.readAsText(f)}
document.querySelectorAll('input').forEach(input=>input.addEventListener('input',renderEmail));document.getElementById('senderSignature').addEventListener('input',renderEmail);renderEmail();
