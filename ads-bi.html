  /* ================= POWER BI REPORT THEME ================= */
  :root{
    --pbi-yellow:#F2C811; --pbi-bg:#F4F5FA; --pbi-panel:#FFFFFF; --pbi-border:#E4E7F1;
    --pbi-sidebar:#252423; --pbi-sidebar-hover:#333130; --pbi-sidebar-text:#D6D5D4; --pbi-sidebar-text-dim:#8A8886;
    --pbi-blue:#3D5AFE; --pbi-darkblue:#12239E; --pbi-orange:#E66C37; --pbi-purple:#6B007B; --pbi-pink:#E044A7; --pbi-violet:#744EC2; --pbi-teal:#197278; --pbi-green:#1AAB40; --pbi-red:#D64550; --pbi-gold:#D9B300;
    --pbi-text:#252423; --pbi-text-sub:#605E5C;

  #dashboard{background:var(--pbi-bg);border-radius:12px;padding:20px 20px 40px;font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif}

  #dashboard .dash-title-small{color:var(--pbi-blue);font-weight:800;letter-spacing:.09em}
  #dashboard .dash-title{color:var(--pbi-text);letter-spacing:-.02em}
  #dashboard select,#dashboard input,#dashboard textarea{border-radius:4px;border-color:var(--pbi-border);height:38px}
  #dashboard .btn{border-radius:4px;height:38px}
  #dashboard .btn.primary{background:var(--pbi-blue)}
  #dashboard .status.good{background:#E6F7EE;color:#0F7B3E}
  #dashboard .status.bad{background:#FDEEEF;color:#C4314B}
  .mix-over{color:#0F7B3E;font-weight:800}
  .mix-under{color:#C4314B;font-weight:800}
  #sourceHover .hover-title{font-size:19px}
  #sourceHover .hover-kpi-value{font-size:16px}
  #dashboard .card,#dashboard .kpi-card,#dashboard .insight-card,#dashboard .metric-card,#dashboard .form-card,#dashboard .summary-card,#dashboard .mini-chart{background:var(--pbi-panel);border:1px solid var(--pbi-border);border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  #dashboard .card,#dashboard .kpi-card,#dashboard .insight-card{border-radius:6px}
  #dashboard .card-kicker{color:var(--pbi-blue);font-weight:800;letter-spacing:.08em}
  #dashboard .card-title{color:var(--pbi-text);font-size:16px;letter-spacing:-.01em;margin-top:4px}
  #dashboard .kpi-card{position:relative;padding:16px 18px;min-height:96px}
  #dashboard .kpi-label{color:var(--pbi-text-sub);font-weight:700;margin-bottom:0}
  #dashboard .kpi-value{color:var(--pbi-text);font-weight:700;letter-spacing:-.02em}
  .kpi-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 28px}
  .kpi-icon svg{width:14px;height:14px}
  .kpi-icon.kpi-icon-blue,.kpi-icon.kpi-icon-teal,.kpi-icon.kpi-icon-orange,.kpi-icon.kpi-icon-violet,.kpi-icon.kpi-icon-pink,.kpi-icon.kpi-icon-green{background:#E8ECFF;color:var(--pbi-blue)}
  .kpi-head-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  #dashboard .insight-label{color:var(--pbi-text-sub)}
  #dashboard .insight-value{color:var(--pbi-text)}
  #dashboard th{background:#FAFAFA;color:var(--pbi-text-sub);border-bottom:1px solid var(--pbi-border)}
  #dashboard td{color:var(--pbi-text);border-bottom:1px solid #F0F0F0}
  #dashboard .bar{background:linear-gradient(90deg,var(--pbi-blue),#59B6FF)}

  .bi-tabs{display:flex;gap:28px;border-bottom:2px solid var(--pbi-border);margin:0 0 20px;padding:0 2px;overflow-x:auto}
  .bi-tab{background:transparent;border:0;padding:12px 2px;font-size:14px;font-weight:700;color:var(--pbi-text-sub);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;font-family:inherit}

  .bi-tab.active{color:var(--pbi-blue);border-bottom-color:var(--pbi-blue)}

  .matrix-hint{font-size:12px;color:var(--pbi-text-sub);font-weight:600;white-space:nowrap;align-self:flex-end;padding-bottom:2px}
  .month-th{cursor:pointer;user-select:none;transition:background .12s,color .12s}
  .month-th:hover{background:#E8ECFF!important;color:var(--pbi-blue)!important}

  .chart-hover-popover{display:none;position:fixed;z-index:9999;background:#fff;border:1px solid var(--pbi-border);border-radius:8px;box-shadow:0 14px 36px rgba(20,20,20,.18);padding:14px 16px;min-width:250px;max-width:290px;pointer-events:none;font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif}

  .chv-row{display:grid;grid-template-columns:70px 1fr 46px;align-items:center;gap:8px;margin-bottom:7px}

  .chv-empty{font-size:12px;color:var(--pbi-text-sub)}

  .compare-inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}

  #dashboard .movers-change-cell.bad{color:#C4314B}
  #dashboard .movers-change-cell.neutral{color:var(--pbi-text-sub);font-weight:600}
  @media(max-width:1024px){.compare-inputs{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:520px){.compare-inputs{grid-template-columns:1fr}}

  .chart-empty-msg{height:250px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--pbi-text-sub);font-size:13px;border:1px dashed var(--pbi-border);border-radius:8px;padding:20px;background:#FAFAFA}
  .insight-callout{display:none;align-items:flex-start;gap:10px;background:#F5F7FF;border:1px solid #E4E7F1;border-radius:8px;padding:12px 14px;margin-top:14px;font-size:13px;line-height:1.55;color:#3A3F55}

  .insight-callout b{color:#111827;font-weight:700}
  .top10-table table{table-layout:fixed}
  .top10-table th:nth-child(1),.top10-table td:nth-child(1){width:24%}
  .top10-table th:nth-child(2),.top10-table td:nth-child(2){width:16%}

  .behavior-source-table th:nth-child(3),.behavior-source-table td:nth-child(3){width:13%}

  .sortable-th.sorted-desc:after{content:'▼';color:var(--pbi-blue)}

<script>
/* ============ date range picker ============ */
const TODAY = new Date(2026,6,31); // 31 Jul 2026
function fmtD(d){ const dd=String(d.getDate()).padStart(2,'0'); const mm=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]; return `${dd} ${mm} ${d.getFullYear()}`; }
function fmtSlash(d){ const dd=String(d.getDate()).padStart(2,'0'); const mm=String(d.getMonth()+1).padStart(2,'0'); return `${dd}/${mm}/${d.getFullYear()}`; }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function endOfMonth(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0); }

const presets = [
  {key:'alltime', label:'All Time', range:()=>[new Date(2020,0,1), new Date(2030,11,31)]},
  {key:'today', label:'Today', range:()=>[TODAY, TODAY]},
  {key:'yesterday', label:'Yesterday', range:()=>[addDays(TODAY,-1), addDays(TODAY,-1)]},
  {key:'last7', label:'Last 7 Days', range:()=>[addDays(TODAY,-6), TODAY]},
  {key:'last14', label:'Last 14 Days', range:()=>[addDays(TODAY,-13), TODAY]},
  {key:'last30', label:'Last 30 Days', range:()=>[addDays(TODAY,-29), TODAY]},
  {key:'thismonth', label:'This Month', range:()=>[startOfMonth(TODAY), TODAY]},
  {key:'lastmonth', label:'Last Month', range:()=>{ const m=new Date(TODAY.getFullYear(),TODAY.getMonth()-1,1); return [startOfMonth(m), endOfMonth(m)]; }},
  {key:'custom', label:'Custom', range:()=>[dateRangeStart, dateRangeEnd]},
];

let dateRangeStart = new Date(2020,0,1);
let dateRangeEnd = new Date(2030,11,31);
let activePreset = 'alltime';
let calRefMonth = new Date(); // left calendar month
let pendingPick = null;

function toggleDatePanel(){
  const panel = document.getElementById('datePanel');
  const input = document.getElementById('dateRangeInput');
  const willOpen = panel.style.display === 'none';
  if(willOpen){
    const rect = input.getBoundingClientRect();
    const panelWidth = Math.min(600, window.innerWidth - 24);
    let left = rect.left;
    if(left + panelWidth > window.innerWidth - 12) left = window.innerWidth - panelWidth - 12;
    if(left < 12) left = 12;
    panel.style.left = left + 'px';
    panel.style.top = (rect.bottom + 6) + 'px';
  }
  panel.style.display = willOpen ? 'flex' : 'none';
  if(willOpen) renderDatePanel();
}
document.addEventListener('click', (e)=>{
  const panel = document.getElementById('datePanel');
  const input = document.getElementById('dateRangeInput');
  if(panel && panel.style.display!=='none' && !panel.contains(e.target) && e.target!==input){
    panel.style.display='none';
  }
});
document.getElementById('datePanel').addEventListener('click', function(e){
  e.stopPropagation();
});

function renderDatePanel(){
  const presetsEl = document.getElementById('datePresets');
  presetsEl.innerHTML = presets.map(p=>{
    const [s,e] = p.range();
    const sub = p.key==='alltime' ? 'Every date in the Sheet' : (p.key==='today' || p.key==='yesterday' ? fmtD(s) : `${fmtD(s)} - ${fmtD(e)}`);
    return `<div class="date-preset${p.key===activePreset?' active':''}" data-preset="${p.key}"><div>${p.label}</div><div class="sub">${sub}</div></div>`;
  }).join('');
  presetsEl.querySelectorAll('.date-preset').forEach(el=>{
    el.onclick = ()=>{
      const p = presets.find(pp=>pp.key===el.dataset.preset);
      const [s,e] = p.range();
      activePreset = p.key; dateRangeStart = s; dateRangeEnd = e;
      calRefMonth = startOfMonth(s);
      renderDatePanel();
    };
  });
  renderCalendars();
}

function renderCalendars(){
  const m1 = new Date(calRefMonth);
  const m2 = new Date(calRefMonth.getFullYear(), calRefMonth.getMonth()+1, 1);
  document.getElementById('calMonthLabel1').textContent = m1.toLocaleString('en-US',{month:'long',year:'numeric'});
  document.getElementById('calMonthLabel2').textContent = m2.toLocaleString('en-US',{month:'long',year:'numeric'});
  document.getElementById('calGrid1').innerHTML = buildCalGrid(m1);
  document.getElementById('calGrid2').innerHTML = buildCalGrid(m2);
  bindCalDays();
}

function buildCalGrid(monthDate){
  const dows = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  let html = dows.map(d=>`<div class="dow">${d}</div>`).join('');
  const first = startOfMonth(monthDate);
  const last = endOfMonth(monthDate);
  const startPad = first.getDay();
  for(let i=0;i<startPad;i++){ html += `<div class="day muted"></div>`; }
  for(let day=1; day<=last.getDate(); day++){
    const d = new Date(monthDate.getFullYear(), monthDate.getMonth(), day);
    const inRange = d>=dateRangeStart && d<=dateRangeEnd;
    const isEdge = d.getTime()===dateRangeStart.getTime() || d.getTime()===dateRangeEnd.getTime();
    const cls = isEdge ? 'day range-edge' : (inRange ? 'day in-range' : 'day');
    html += `<div class="${cls}" data-y="${d.getFullYear()}" data-m="${d.getMonth()}" data-d="${day}">${day}</div>`;
  }
  return html;
}

function bindCalDays(){
  document.querySelectorAll('.date-cal-grid .day:not(.muted)').forEach(el=>{
    el.onclick = ()=>{
      const d = new Date(parseInt(el.dataset.y), parseInt(el.dataset.m), parseInt(el.dataset.d));
      if(!pendingPick){
        dateRangeStart = d; dateRangeEnd = d; pendingPick = d;
      } else {
        if(d < pendingPick){ dateRangeStart = d; dateRangeEnd = pendingPick; } else { dateRangeStart = pendingPick; dateRangeEnd = d; }
        pendingPick = null;
      }
      activePreset = 'custom';
      renderDatePanel();
    };
  });
}

function shiftCalMonth(dir){
  calRefMonth = new Date(calRefMonth.getFullYear(), calRefMonth.getMonth()+dir, 1);
  renderCalendars();
}

function applyDateRange(){
  document.getElementById('dateRangeInput').value = activePreset==='alltime' ? 'All Time' : `${fmtD(dateRangeStart)} - ${fmtD(dateRangeEnd)}`;
  document.getElementById('datePanel').style.display = 'none';
  if(typeof renderAll === 'function') renderAll();
  else if(typeof runCompare === 'function') runCompare();
}

// ===================== LIVE DATA (fetched from the Google Sheet Web App) =====================

// Paste the deployed Web App URL here (Apps Script > Deploy > New deployment > Web app).
// It should end in /exec. Until this is set, the dashboard shows a setup message instead of data.
const SHEET_API_URL = "https://script.google.com/a/macros/media-console.com/s/AKfycbzHnCQXPm4ETNBuADCNVCiX9oMMPEIi47Un1hCRPqLaGAo5yMWFRlT-RdVq0p90lN_-/exec";

// data (no more hardcoded destination list — this now reflects whatever's in the Sheet).
const PALETTE = ["#3D5AFE","#1AAB40","#D64550","#744EC2","#197278","#E9A23B","#7b8798","#a8a29e","#0EA5E9","#DB2777"];
let destColors = {};

let channels = [];   // populated from real data after fetch
let geos = [];        // populated from real data after fetch
let currentObjective = "all"; // all | Branding | Conversion

let rawData = {}; // { destination: { hotels: [ { name, campaigns:[ {channel, objective, geo:{GEOCODE:{monthKey:{spend,impr,clicks,conv,revenue}}}} ] } ] } } — built from "Aggregated" (Raw Import - Ads): accurate daily totals, coarse/no real GEO.
let geoRawData = {}; // same shape, built from "Geo Detail" (Raw Import - Geos): accurate per-country GEO, monthly resolution. Used only by Geo Overview / Hotel vs GEO / Geo vs Campaign.

/**
 * Shared row->tree builder used for both the Aggregated feed and the Geo
 * Detail feed (same column shape, same nesting logic — just different rows
 * and, in practice, different GEO granularity depending on which sheet they
 * came from). Also folds in a synthetic "All Destinations" entry (union of
 * every real destination's hotels) so every render/agg function can just
 * read tree[currentDest].hotels without any special-casing.
 */
function buildDestTree(rowList){
  const channelSet = new Set();
  const geoSet = new Set();
  const destMap = new Map();

  rowList.forEach(row=>{
    const dest = row['Destination'];
    const hotelCode = row['Hotel Code'];
    const hotelName = (row['Hotel Name'] || hotelCode || '').toString().trim();
    const channel = row['Channel'];
    const objective = row['Objective'];
    const geo = String(row['GEO'] || '').trim() || '(Unspecified)';
    if(!dest || !hotelName) return;

    channelSet.add(channel);
    geoSet.add(geo);

    if(!destMap.has(dest)) destMap.set(dest, new Map());
    const hotelMap = destMap.get(dest);
    if(!hotelMap.has(hotelName)) hotelMap.set(hotelName, { name: hotelName, campaignMap: new Map() });
    const hotelEntry = hotelMap.get(hotelName);

    const campKey = channel + '||' + objective;
    if(!hotelEntry.campaignMap.has(campKey)) hotelEntry.campaignMap.set(campKey, { channel, objective, geo:{} });
    const camp = hotelEntry.campaignMap.get(campKey);
    const monthKey = normalizeMonthKey(row['Month']);
    if(!camp.geo[geo]) camp.geo[geo] = {};
    if(!camp.geo[geo][monthKey]) camp.geo[geo][monthKey] = {spend:0, impr:0, clicks:0, videoViews:0, completedViews:0, conv:0, revenue:0, nativeSpend:0, nativeRevenue:0, currency:''};
    const bucket = camp.geo[geo][monthKey];
    bucket.spend += pickNumField(row, ['Ad Spend (THB)','Ad Spend']);
    bucket.impr += Number(row['Impressions'])||0;
    bucket.clicks += Number(row['Clicks'])||0;
    bucket.videoViews += Number(row['Video Views'])||0;
    bucket.completedViews += Number(row['Completed Views'])||0;
    bucket.conv += Number(row['Conversions'])||0;
    bucket.revenue += pickNumField(row, ['Revenue (THB)','Revenue']);
    bucket.nativeSpend += Number(row['Ad Spend (Native)'])||0;
    bucket.nativeRevenue += Number(row['Revenue (Native)'])||0;
    if(row['Currency']) bucket.currency = row['Currency']; // consistent within a hotel — last-write is fine
  });

  const tree = {};
  destMap.forEach((hotelMap, dest)=>{
    const hotels = [];
    hotelMap.forEach(hotelEntry=>{
      hotels.push({ name: hotelEntry.name, campaigns: Array.from(hotelEntry.campaignMap.values()) });
    });
    tree[dest] = { hotels };
  });

  const allHotels = [];
  Object.values(tree).forEach(d => allHotels.push(...d.hotels));
  tree['All Destinations'] = { hotels: allHotels };

  return { tree, channels: Array.from(channelSet).sort(), geos: Array.from(geoSet).sort() };
}

/**
 * Fetches the Aggregated sheet (as JSON, via the Apps Script Web App) and
 * reshapes it from a flat row list into the { destination -> hotels -> campaigns -> geo }
 * tree the rest of this dashboard is built around. Every row in the Sheet is
 * Destination x Hotel x Channel x Objective x GEO x Month — this collapses
 * the Month dimension by summing (so "Ad Spend" etc. here means "total over
 * whatever's currently in the Sheet"; wire in the Date Range picker later if
 * you want to filter by Month instead of always summing everything).
 */
/**
 * The Sheet's "Month" column is written as plain text like "2026-06", but
 * Google Sheets sometimes auto-detects that as an actual date and stores it
 * as one — which then comes back through the JSON API as a full ISO
 * timestamp (e.g. "2025-09-30T17:00:00.000Z") instead of the clean string.
 * This recovers the intended "YYYY-MM" key either way. When it has to
 * recover from an ISO timestamp, it reads the date at a fixed UTC+7
 * (Bangkok) offset — the timezone the value was originally written in — so
 * the recovered month doesn't depend on whatever timezone the viewer's own
 * browser happens to be in.
 */
function normalizeMonthKey(raw){
  if(!raw) return 'unknown';
  const str = String(raw).trim();
  if(/^\d{4}-\d{2}$/.test(str)) return str; // already clean
  const d = new Date(str);
  if(isNaN(d.getTime())) return 'unknown';
  const bangkok = new Date(d.getTime() + 7*60*60*1000);
  const y = bangkok.getUTCFullYear();
  const m = String(bangkok.getUTCMonth()+1).padStart(2,'0');
  return `${y}-${m}`;
}
/** "2026-06" -> "Jun 2026" for display. Sorting should always use the raw "YYYY-MM" key, not this. */
function formatMonthLabel(monthKey){
  if(monthKey === 'unknown') return 'Unknown';
  const parts = monthKey.split('-');
  const y = Number(parts[0]), m = Number(parts[1]);
  if(!y || !m) return monthKey;
  const names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${names[m-1]} ${y}`;
}

function pickNumField(row, candidateNames){
  for(const name of candidateNames){
    if(row[name] !== undefined && row[name] !== ''){ const n = Number(row[name]); if(!isNaN(n)) return n; }
  }
  return 0;
}

function loadRealData(){
  return new Promise((resolve, reject) => {
    const callbackName = 'adsBiCallback_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    let finished = false;

    const cleanup = () => {
      if (script.parentNode) script.parentNode.removeChild(script);
      try { delete window[callbackName]; } catch (_) { window[callbackName] = undefined; }
    };

    const timeoutId = setTimeout(() => {
      if (finished) return;
      finished = true;
      cleanup();
      reject(new Error('Data request timed out. Please confirm that you are signed in with a media-console.com account.'));
    }, 30000);

    window[callbackName] = function(data){
      if (finished) return;
      finished = true;
      clearTimeout(timeoutId);
      cleanup();

      try {
        if (!data) throw new Error('The Web App returned an empty response.');
        if (data.error) throw new Error(data.error);

        let savedRate = null;
        try{ savedRate = localStorage.getItem('adsbi_usd_rate'); }catch(e){ /* localStorage unavailable */ }
        if(savedRate){
          EXCHANGE_RATE_USD = Number(savedRate); // this browser already set its own rate — keep using it
        } else if(data.rates && data.rates.USD){
          EXCHANGE_RATE_USD = Number(data.rates.USD); // first visit on this browser — start from the Sheet's rate
        }

        const adsResult = buildDestTree(data.rows || []);
        rawData = adsResult.tree;
        channels = adsResult.channels;

        // Geo Detail (from "Raw Import - Geos") has the real per-country
        // breakdown; Aggregated (from "Raw Import - Ads") mostly won't. Build
        // a SEPARATE tree from it so Geo-related view modes (Geo Overview,
        // Hotel vs GEO, Geo vs Campaign) can read real geo data, while
        // Campaign-only view modes keep reading the daily-accurate rawData.
        const geoResult = buildDestTree(data.geoRows || []);
        geoRawData = geoResult.tree;
        geos = geoResult.geos.length ? geoResult.geos : adsResult.geos;

        destColors = {};
        Object.keys(rawData).sort().forEach((dest,i)=>{ destColors[dest] = PALETTE[i % PALETTE.length]; });

        resolve();
      } catch (err) {
        reject(err);
      }
    };

    script.onerror = function(){
      if (finished) return;
      finished = true;
      clearTimeout(timeoutId);
      cleanup();
      reject(new Error('Failed to load data. Please sign in with a media-console.com account and refresh the page.'));
    };

    const separator = SHEET_API_URL.includes('?') ? '&' : '?';
    script.src = SHEET_API_URL + separator +
      'callback=' + encodeURIComponent(callbackName) +
      '&_=' + Date.now();

    document.body.appendChild(script);
  });
}

function sumMetrics(list){
  return list.reduce((acc,m)=>({
    spend:acc.spend+m.spend, impr:acc.impr+m.impr, clicks:acc.clicks+m.clicks,
    videoViews:acc.videoViews+(m.videoViews||0), completedViews:acc.completedViews+(m.completedViews||0),
    conv:acc.conv+m.conv, revenue:acc.revenue+m.revenue,
    nativeSpend:acc.nativeSpend+(m.nativeSpend||0), nativeRevenue:acc.nativeRevenue+(m.nativeRevenue||0),
    currency: acc.currency || m.currency || '' // meaningful only when every item in `list` shares one currency (i.e. a single hotel is selected) — display code gates on that
  }), {spend:0,impr:0,clicks:0,videoViews:0,completedViews:0,conv:0,revenue:0,nativeSpend:0,nativeRevenue:0,currency:''});
}
function deriveRates(m){
  return {
    cpm: m.impr ? m.spend/m.impr*1000 : 0,
    cpc: m.clicks ? m.spend/m.clicks : 0,
    ctr: m.impr ? m.clicks/m.impr*100 : 0,
    cpa: m.conv ? m.spend/m.conv : 0,
    cvr: m.clicks ? m.conv/m.clicks*100 : 0,
    abv: m.conv ? m.revenue/m.conv : 0,
    roas: m.spend ? m.revenue/m.spend : 0
  };
}
let EXCHANGE_RATE_USD = 36.5; // overwritten from the Sheet's Settings tab once data loads
let currentCurrency = 'THB'; // THB | USD — all underlying data is stored in THB

function fmtMoney(n){
  const v = currentCurrency==='USD' ? n/EXCHANGE_RATE_USD : n;
  const symbol = currentCurrency==='USD' ? '$' : '฿';
  return symbol+v.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtMoneyDecimal(n){ // always 2 decimals + thousand separators — kept name for existing call sites
  return fmtMoney(n);
}
/** Formats a number that's ALREADY in the target display currency — no rate
 * conversion applied. Used for the exact-native-figure path below. */
function fmtMoneyExact(n){
  const symbol = currentCurrency==='USD' ? '$' : '฿';
  return symbol+n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}
/**
 * A fixed exchange rate is only ever an approximation of what a campaign's
 * spend/revenue "really" was on any given day — and if the rate in Settings
 * gets updated later without re-running Parse & Aggregate on old data, the
 * THB-derived USD figure can drift from the true original dollar amount.
 * When exactly one hotel is selected (so every row shares one currency) and
 * that hotel's native currency matches the currency toggle, we can sidestep
 * all of that and show the untouched original figure instead — this returns
 * true when that's possible for the given metrics object `m`.
 */
function canShowExactNative(m){
  return currentHotelFilter !== 'all' && !!m.currency && m.currency === currentCurrency;
}
function fmtNum(n){ return Math.round(n).toLocaleString('en-US', {maximumFractionDigits:0}); }
function fmtPercent2(n){ return n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})+'%'; }
function fmtRatio2(n){ return n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }

/** monthKey is 'YYYY-MM' (or 'unknown' for rows the Sheet couldn't date). */
function isMonthInRange(monthKey){
  if(monthKey === 'unknown') return true; // don't silently drop undated rows
  const parts = monthKey.split('-').map(Number);
  const y = parts[0], m = parts[1];
  if(!y || !m) return true;
  const d = new Date(y, m-1, 1);
  const startMonth = new Date(dateRangeStart.getFullYear(), dateRangeStart.getMonth(), 1);
  const endMonth = new Date(dateRangeEnd.getFullYear(), dateRangeEnd.getMonth(), 1);
  return d >= startMonth && d <= endMonth;
}

/**
 * Groups a hotel list's campaigns by Month (YYYY-MM), ignoring the top Date
 * Range picker entirely — Monthly mode's whole point is showing the full
 * trend over time, so it always uses every month that exists in the data.
 * campaignFilterFn: optional (campaign)=>boolean to narrow by channel/objective.
 * geoFilter: optional exact GEO name to narrow to just one country.
 */
function aggByMonthGeneric(hotels, campaignFilterFn, geoFilter){
  const acc = {};
  hotels.forEach(h => h.campaigns.forEach(c => {
    if(campaignFilterFn && !campaignFilterFn(c)) return;
    Object.keys(c.geo).forEach(g => {
      if(geoFilter && g !== geoFilter) return;
      Object.keys(c.geo[g]).forEach(mk => {
        if(mk === 'unknown') return; // no real date — doesn't belong on a monthly trend
        if(!acc[mk]) acc[mk] = [];
        acc[mk].push(c.geo[g][mk]);
      });
    });
  }));
  return Object.entries(acc)
    .map(([month,list])=>({label:month, m:sumMetrics(list)}))
    .sort((a,b)=>a.label.localeCompare(b.label))
    .map(r=>({...r, label:formatMonthLabel(r.label)}));
}

/** Collapses a {monthKey: metrics} map down to one flat metrics object, summing only months inside the currently selected Date Range. */
function geoInRange(monthMap){
  return sumMetrics(Object.keys(monthMap).filter(isMonthInRange).map(mk=>monthMap[mk]));
}

/** Combines several {monthKey: metrics} maps into one chronological per-month
 * series, respecting the current Date Range filter. Used by Monthly mode. */
function monthlyBreakdown(monthMapsList){
  const acc = {};
  monthMapsList.forEach(monthMap=>{
    Object.keys(monthMap).forEach(mk=>{
      if(mk === 'unknown' || !isMonthInRange(mk)) return;
      if(!acc[mk]) acc[mk] = [];
      acc[mk].push(monthMap[mk]);
    });
  });
  return Object.keys(acc).sort().map(mk=>({month:mk, m:sumMetrics(acc[mk])}));
}
function fmtMonthLabel(yyyyMm){
  const [y,m] = yyyyMm.split('-').map(Number);
  if(!y || !m) return yyyyMm;
  return new Date(y, m-1, 1).toLocaleDateString('en-US', {month:'short', year:'numeric'});
}

function aggByGeoForObjective(dest, obj){
  const acc = {};
  getHotelsForGeoAgg(dest).forEach(h=> h.campaigns.forEach(c=>{
    if(c.objective !== obj) return;
    Object.keys(c.geo).forEach(g=>{
      if(!acc[g]) acc[g]=[];
      acc[g].push(geoInRange(c.geo[g]));
    });
  }));
  return Object.entries(acc).map(([geo,list])=>({label:geo, m:sumMetrics(list)}));
}

function aggByChannel(dest){
  const acc = {};
  getHotelsForAgg(dest).forEach(h=> h.campaigns.forEach(c=>{
    const key = c.channel + '||' + c.objective;
    if(!acc[key]) acc[key] = { label:c.channel, objective:c.objective, list:[] };
    Object.keys(c.geo).forEach(g=> acc[key].list.push(geoInRange(c.geo[g])));
  }));
  return Object.values(acc).map(entry=>({label:entry.label, m:sumMetrics(entry.list), objective:entry.objective}));
}
function aggByGeo(dest){
  const acc = {};
  getHotelsForGeoAgg(dest).forEach(h=> h.campaigns.forEach(c=>{
    Object.keys(c.geo).forEach(g=>{
      if(!acc[g]) acc[g]=[];
      acc[g].push(geoInRange(c.geo[g]));
    });
  }));
  return Object.entries(acc).map(([geo,list])=>({label:geo, m:sumMetrics(list)}));
}
function aggByHotelCampaign(dest){
  return getHotelsForAgg(dest).map(h=>{
    const hotelAll = [];
    h.campaigns.forEach(c=> Object.keys(c.geo).forEach(g=> hotelAll.push(geoInRange(c.geo[g]))));
    return {
      label:h.name,
      m:sumMetrics(hotelAll),
      children:h.campaigns.map(c=>({label:c.channel, m:sumMetrics(Object.keys(c.geo).map(g=>geoInRange(c.geo[g]))), objective:c.objective}))
    };
  }).filter(h=>h.children.length);
}
function aggByHotelGeo(dest){
  return getHotelsForGeoAgg(dest).map(h=>{
    const filteredCampaigns = h.campaigns.filter(c=> currentObjective==='all' || c.objective===currentObjective);
    const hotelAll = [];
    const geoAcc = {};
    filteredCampaigns.forEach(c=> Object.keys(c.geo).forEach(g=>{
      if(!geoAcc[g]) geoAcc[g]=[];
      const m = geoInRange(c.geo[g]);
      hotelAll.push(m);
      geoAcc[g].push(m);
    }));
    return {
      label:h.name,
      m:sumMetrics(hotelAll),
      children:Object.entries(geoAcc).filter(([g,l])=>l.length).map(([g,l])=>({label:g, m:sumMetrics(l)}))
    };
  }).filter(h=>h.children.length);
}
function aggByGeoCampaign(dest){
  const acc = {}; // geo -> "channel||objective" -> list
  getHotelsForGeoAgg(dest).forEach(h=> h.campaigns.forEach(c=>{
    const key = c.channel + '||' + c.objective;
    Object.keys(c.geo).forEach(g=>{
      if(!acc[g]) acc[g] = {};
      if(!acc[g][key]) acc[g][key] = { label:c.channel, objective:c.objective, list:[] };
      acc[g][key].list.push(geoInRange(c.geo[g]));
    });
  }));
  return Object.entries(acc).filter(([g,chMap])=>Object.keys(chMap).length)
    .map(([geo,chMap])=>{
      const all=[]; Object.values(chMap).forEach(entry=>all.push(...entry.list));
      return {
        label:geo,
        m:sumMetrics(all),
        children:Object.values(chMap).map(entry=>({label:entry.label, m:sumMetrics(entry.list), objective:entry.objective}))
      };
    });
}

// ===================== Custom combobox (click shows full list, typing filters) =====================
const comboOptions = {}; // inputId -> array of option strings
const comboOnSelect = {}; // inputId -> function(value)

function setupCombo(inputId, options, onSelect, currentValue){
  comboOptions[inputId] = options;
  comboOnSelect[inputId] = onSelect;
  document.getElementById(inputId).value = currentValue;
}

function renderComboList(inputId, optionsToShow){
  const listEl = document.getElementById(inputId+'_list');
  if(!optionsToShow.length){
    listEl.innerHTML = `<div class="combo-empty">No matches</div>`;
  } else {
    listEl.innerHTML = optionsToShow.map(o=>`<div class="combo-item">${o}</div>`).join('');
    Array.from(listEl.children).forEach((el,i)=>{
      el.onclick = ()=>{
        document.getElementById(inputId).value = optionsToShow[i];
        listEl.style.display = 'none';
        comboOnSelect[inputId](optionsToShow[i]);
      };
    });
  }
  listEl.style.display = 'block';
}

function onComboFocus(inputId){
  renderComboList(inputId, comboOptions[inputId] || []);
}
function onComboInput(inputId){
  const query = document.getElementById(inputId).value.toLowerCase();
  const all = comboOptions[inputId] || [];
  const filtered = query ? all.filter(o=>o.toLowerCase().includes(query)) : all;
  renderComboList(inputId, filtered);
}
document.addEventListener('click', (e)=>{

    const wrap = listEl.closest('.combo-wrap');
    if(wrap && !wrap.contains(e.target)) listEl.style.display = 'none';

/**
 * The exchange rate used for approximate (non-exact) currency display lives
 * on the dashboard itself, not in the Google Sheet — the Sheet's rate is only
 * used once, as the initial default the first time this browser loads the
 * dashboard. This is on purpose: the Sheet is kept locked down to one owner
 * to avoid accidental edits corrupting the underlying data, but anyone
 * viewing the dashboard can still tune the display rate for their own use,
 * saved locally in their browser (localStorage), without needing Sheet access.
 */
function onRateChange(v){
  const rate = Number(v);
  if(!rate || rate <= 0) { document.getElementById('rateInput').value = EXCHANGE_RATE_USD; return; }
  EXCHANGE_RATE_USD = rate;
  try{ localStorage.setItem('adsbi_usd_rate', String(rate)); }catch(e){ /* localStorage unavailable — rate still applies for this session */ }
  renderAll();
}

function applyCampaignFilter(hotels){
  if(currentCampaignFilter === 'all') return hotels;
  return hotels
    .map(h=>({...h, campaigns: h.campaigns.filter(c=>c.channel===currentCampaignFilter)}))
    .filter(h=>h.campaigns.length);
}
function getHotelsForAgg(dest){
  const all = rawData[dest].hotels;
  const hotels = currentHotelFilter === 'all' ? all : all.filter(h=>h.name===currentHotelFilter);
  return applyCampaignFilter(hotels);
}

/** Same as getHotelsForAgg but reads geoRawData (from Geo Detail) — falls back to an empty list if this destination/hotel has no Geo Detail rows at all. */
function getHotelsForGeoAgg(dest){
  const all = (geoRawData[dest] && geoRawData[dest].hotels) ? geoRawData[dest].hotels : [];
  const hotels = currentHotelFilter === 'all' ? all : all.filter(h=>h.name===currentHotelFilter);
  return applyCampaignFilter(hotels);
}

    subs.map(s=>`<div class="metric-value-box" style="padding:6px 8px;"><div class="metric-value-label" style="font-size:10px;margin-bottom:2px;">${s.label}</div><div class="metric-value-number" style="font-size:12.5px;">${s.value}</div></div>`).join('') +
    `</div>` : '';
  return `<div class="kpi-card" style="min-height:0;padding:12px 14px;"><div class="kpi-head-row" style="margin-bottom:6px;"><div class="kpi-label" style="margin-bottom:0;font-size:11px;">${label}</div>

}

function rowCellsGlobal(m){

  const rt = useNative ? deriveRates({...m, spend:m.nativeSpend, revenue:m.nativeRevenue}) : deriveRates(m);
  const money = useNative ? fmtMoneyExact : fmtMoney;
  const moneyDec = useNative ? fmtMoneyExact : fmtMoneyDecimal;
  const displaySpend = useNative ? m.nativeSpend : m.spend;
  const displayRevenue = useNative ? m.nativeRevenue : m.revenue;
  return `<td class="money">${money(displaySpend)}</td><td class="money">${fmtNum(m.impr)}</td><td class="money">${moneyDec(rt.cpm)}</td>
    <td class="money">${fmtNum(m.clicks)}</td><td class="money">${moneyDec(rt.cpc)}</td><td class="money">${fmtPercent2(rt.ctr)}</td>
    <td class="money">${fmtNum(m.videoViews||0)}</td><td class="money">${fmtNum(m.completedViews||0)}</td>
    <td class="money">${fmtNum(m.conv)}</td><td class="money">${moneyDec(rt.cpa)}</td><td class="money">${fmtPercent2(rt.cvr)}</td>
    <td class="money">${money(rt.abv)}</td><td class="money">${money(displayRevenue)}</td><td class="money">${fmtRatio2(rt.roas)}</td>`;

function buildNestedObjectiveSections(children){
  const brandingItems = children.filter(c=>c.objective==='Branding' && c.m.spend>0).sort((a,b)=>b.m.spend-a.m.spend);
  const conversionItems = children.filter(c=>c.objective==='Conversion' && c.m.spend>0).sort((a,b)=>b.m.spend-a.m.spend);
  const brandingTotal = sumMetrics(brandingItems.map(c=>c.m));
  const conversionTotal = sumMetrics(conversionItems.map(c=>c.m));

  let html = '';
  if(brandingItems.length){
    let body = brandingItems.map(c=>`<tr><td><strong>${c.label}</strong></td>${rowCellsGlobal(c.m)}</tr>`).join('');
    body += `<tr class="grandtotal-row"><td><strong>Grand Total</strong></td>${rowCellsGlobal(brandingTotal)}</tr>`;
    html += `<div class="section-title">BRANDING CAMPAIGNS</div><div class="table-wrap no-inner-scroll"><table class="data-table">${theadHtml('Campaign')}<tbody>${body}</tbody></table></div>`;
  }
  if(conversionItems.length){
    if(html) html += '<div class="section-gap"></div>';
    let body = conversionItems.map(c=>`<tr><td><strong>${c.label}</strong></td>${rowCellsGlobal(c.m)}</tr>`).join('');
    body += `<tr class="grandtotal-row"><td><strong>Grand Total</strong></td>${rowCellsGlobal(conversionTotal)}</tr>`;
    html += `<div class="section-title">CONVERSION CAMPAIGNS</div><div class="table-wrap no-inner-scroll"><table class="data-table">${theadHtml('Campaign')}<tbody>${body}</tbody></table></div>`;
  }
  return html;
}

// ===================== Ranked list: search + top-10 + view all (Geo Overview, Geo vs Campaign) =====================
const rankedRowsStore = {};
const rankedRendererStore = {};
const rankedState = {};

/**
 * Renders a search box + "View All" toggle + a table placeholder. Only the
 * placeholder's contents get replaced on search/toggle (never the input
 * itself), so the search box keeps focus while typing.
 */
function renderRankedList(sectionId, allRowsSortedBySpend, opts){
  rankedRowsStore[sectionId] = allRowsSortedBySpend;
  rankedRendererStore[sectionId] = opts;
  if(!rankedState[sectionId]) rankedState[sectionId] = {showAll:false, query:''};
  const searchId = 'search_'+sectionId, tableWrapId = 'tablewrap_'+sectionId, viewAllId = 'viewall_'+sectionId;
  const titleHtml = opts.sectionTitle ? `<div class="section-title" style="margin-bottom:0;">${opts.sectionTitle}</div>` : `<div></div>`;
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:12px;">
      ${titleHtml}
      <div style="display:flex;align-items:center;gap:12px;">
        <input id="${searchId}" type="text" placeholder="Search ${opts.colLabel}..." value="${rankedState[sectionId].query||''}" oninput="updateRankedSection('${sectionId}')" style="border:1px solid #dedad0;border-radius:8px;padding:8px 12px;font-size:13px;width:220px;">
        <a href="javascript:void(0)" id="${viewAllId}" onclick="toggleRankedShowAll('${sectionId}')" style="font-size:13px;color:#3D5AFE;font-weight:600;display:none;white-space:nowrap;"></a>
      </div>
    </div>
    <div id="${tableWrapId}"></div>`;
}

function computeRankedBody(sectionId){
  const rows = rankedRowsStore[sectionId] || [];
  const opts = rankedRendererStore[sectionId];
  const state = rankedState[sectionId];
  const query = (state.query||'').toLowerCase();
  const filtered = query ? rows.filter(r=>r.label.toLowerCase().includes(query)) : rows;
  const displayRows = state.showAll ? filtered : filtered.slice(0,10);

  let body = displayRows.map((r,i)=>opts.rowRenderer(r,i)).join('');
  if(opts.grandTotalRowHtml) body += opts.grandTotalRowHtml;

  const wrapEl = document.getElementById('tablewrap_'+sectionId);
  if(wrapEl){
    wrapEl.innerHTML = `<div class="table-wrap no-inner-scroll"><table class="data-table">${opts.theadHtml}<tbody>${body}</tbody></table></div>`;
  }
  const viewAllEl = document.getElementById('viewall_'+sectionId);
  if(viewAllEl){
    if(filtered.length > 10){
      viewAllEl.style.display = 'inline';
      viewAllEl.textContent = state.showAll ? 'Show Top 10' : `View All (${filtered.length})`;
    } else {
      viewAllEl.style.display = 'none';
    }
  }
}

function updateRankedSection(sectionId){
  const input = document.getElementById('search_'+sectionId);
  rankedState[sectionId].query = input.value;
  computeRankedBody(sectionId);
}
function toggleRankedShowAll(sectionId){
  rankedState[sectionId].showAll = !rankedState[sectionId].showAll;
  computeRankedBody(sectionId);
}

function renderTable(){
  const modeCfg = modes.find(m=>m.key===currentMode);
  if(modeCfg.key === 'monthly'){ renderMonthlyMode(); return; }
  let rows = modeCfg.fn(currentDest);
  rows = rows.filter(r=>r.m.spend>0); // only show entities that actually spent something
  const hotelSuffix = currentHotelFilter !== 'all' ? ` — ${currentHotelFilter}` : '';
  document.getElementById('tableTitle').textContent = `${currentDest}${hotelSuffix} — ${modeCfg.label}`;
  const container = document.getElementById('tableContainer');

  // ===== Campaign Overview: Section 1 (Branding/Conversion/Grand Total), gap, Section 2 (detail breakdown) =====
  if(modeCfg.key === 'channel'){
    const brandingRows = rows.filter(r=>r.objective==='Branding').sort((a,b)=>b.m.spend-a.m.spend);
    const conversionRows = rows.filter(r=>r.objective==='Conversion').sort((a,b)=>b.m.spend-a.m.spend);
    const brandingTotal = sumMetrics(brandingRows.map(r=>r.m));
    const conversionTotal = sumMetrics(conversionRows.map(r=>r.m));
    const grandTotal = sumMetrics([brandingTotal, conversionTotal]);

    const donutsHtml = donutRowHtml([
      {id:'donutObjectiveSpend', title:'SPEND: BRANDING VS CONVERSION'},
      {id:'donutCampaignSpend', title:'SPEND BY CAMPAIGN'},
      {id:'donutCampaignRevenue', title:'REVENUE BY CAMPAIGN'}
    ]);

    let sec1 = `<div class="table-wrap no-inner-scroll"><table class="data-table">${theadHtml('Campaign')}<tbody>
      <tr><td><strong>Branding</strong></td>${rowCellsGlobal(brandingTotal)}</tr>
      <tr><td><strong>Conversion</strong></td>${rowCellsGlobal(conversionTotal)}</tr>
      <tr class="grandtotal-row"><td><strong>Grand Total</strong></td>${rowCellsGlobal(grandTotal)}</tr>
    </tbody></table></div>`;

    let sec2 = '';
    if(brandingRows.length){
      let body = brandingRows.map(r=>`<tr><td><strong>${r.label}</strong></td>${rowCellsGlobal(r.m)}</tr>`).join('');
      body += `<tr class="grandtotal-row"><td><strong>Grand Total</strong></td>${rowCellsGlobal(brandingTotal)}</tr>`;
      sec2 += `<div class="section-title">BRANDING CAMPAIGNS</div><div class="table-wrap no-inner-scroll"><table class="data-table">${theadHtml('Campaign')}<tbody>${body}</tbody></table></div>`;
    }
    if(conversionRows.length){
      if(sec2) sec2 += '<div class="section-gap"></div>';
      let body = conversionRows.map(r=>`<tr><td><strong>${r.label}</strong></td>${rowCellsGlobal(r.m)}</tr>`).join('');
      body += `<tr class="grandtotal-row"><td><strong>Grand Total</strong></td>${rowCellsGlobal(conversionTotal)}</tr>`;
      sec2 += `<div class="section-title">CONVERSION CAMPAIGNS</div><div class="table-wrap no-inner-scroll"><table class="data-table">${theadHtml('Campaign')}<tbody>${body}</tbody></table></div>`;
    }

    container.innerHTML = donutsHtml + sec1 + '<div class="section-gap"></div>' + sec2;

    renderDonut('donutObjectiveSpend', [
      {label:'Branding', value:brandingTotal.spend},
      {label:'Conversion', value:conversionTotal.spend}
    ], fmtMoney);
    renderDonut('donutCampaignSpend', rows.map(r=>({label:r.label, value:r.m.spend})), fmtMoney);
    renderDonut('donutCampaignRevenue', rows.map(r=>({label:r.label, value:r.m.revenue})), fmtMoney);

    enableRowFocus(container);
    return;
  }

  // ===== Geo Overview: Section 1 overview+grand total, Section 2 Branding by GEO, Section 3 Conversion by GEO =====
  if(modeCfg.key === 'geo'){
    const geoRowRenderer = r => `<tr><td><strong>${r.label}</strong></td>${rowCellsGlobal(r.m)}</tr>`;

    const sortedRows = rows.slice().sort((a,b)=>b.m.spend-a.m.spend);
    const total = sumMetrics(rows.map(r=>r.m));

    const donutsHtml = donutRowHtml([
      {id:'donutGeoSpend', title:'SPEND BY GEO'},
      {id:'donutGeoBookings', title:'BOOKINGS BY GEO'},
      {id:'donutGeoRevenue', title:'REVENUE BY GEO'}
    ]);

    let sec1Html = renderRankedList('geoOverview', sortedRows, {
      theadHtml: theadHtml('GEO'), colLabel:'GEO', rowRenderer: geoRowRenderer,
      grandTotalRowHtml: `<tr class="grandtotal-row"><td><strong>Grand Total</strong></td>${rowCellsGlobal(total)}</tr>`
    });

    const brandingGeoRows = aggByGeoForObjective(currentDest, 'Branding').filter(r=>r.m.spend>0).sort((a,b)=>b.m.spend-a.m.spend);
    const brandingGeoTotal = sumMetrics(brandingGeoRows.map(r=>r.m));
    let sec2Html = renderRankedList('geoBranding', brandingGeoRows, {
      theadHtml: theadHtml('GEO'), colLabel:'GEO', rowRenderer: geoRowRenderer, sectionTitle:'BRANDING BY GEO',
      grandTotalRowHtml: `<tr class="grandtotal-row"><td><strong>Grand Total</strong></td>${rowCellsGlobal(brandingGeoTotal)}</tr>`
    });

    const conversionGeoRows = aggByGeoForObjective(currentDest, 'Conversion').filter(r=>r.m.spend>0).sort((a,b)=>b.m.spend-a.m.spend);
    const conversionGeoTotal = sumMetrics(conversionGeoRows.map(r=>r.m));
    let sec3Html = renderRankedList('geoConversion', conversionGeoRows, {
      theadHtml: theadHtml('GEO'), colLabel:'GEO', rowRenderer: geoRowRenderer, sectionTitle:'CONVERSION BY GEO',
      grandTotalRowHtml: `<tr class="grandtotal-row"><td><strong>Grand Total</strong></td>${rowCellsGlobal(conversionGeoTotal)}</tr>`
    });

    container.innerHTML = donutsHtml + sec1Html + '<div class="section-gap"></div>' + sec2Html + '<div class="section-gap"></div>' + sec3Html;
    computeRankedBody('geoOverview');
    computeRankedBody('geoBranding');
    computeRankedBody('geoConversion');

    renderDonut('donutGeoSpend', sortedRows.map(r=>({label:r.label, value:r.m.spend})), fmtMoney);
    renderDonut('donutGeoBookings', sortedRows.map(r=>({label:r.label, value:r.m.conv})), fmtNum);
    renderDonut('donutGeoRevenue', sortedRows.map(r=>({label:r.label, value:r.m.revenue})), fmtMoney);

    enableRowFocus(container);
    return;
  }

  // ===== Hotel → Campaign: drill, parent row = name only (no numbers), children as nested stacked sections =====
  if(modeCfg.key === 'hotelcamp'){
    const sortedRows = rows.slice().sort((a,b)=>b.m.spend-a.m.spend);
    let body = '';
    sortedRows.forEach((r,ri)=>{
      body += `<tr class="source-row hotel-header-row" data-row="${ri}"><td colspan="15"><span style="display:inline-block;width:14px;color:#3D5AFE;">▸</span><strong>${r.label}</strong></td></tr>`;
      body += `<tr data-parent="${ri}" style="display:none;"><td colspan="15" style="padding:18px 24px 18px 36px;">${buildNestedObjectiveSections(r.children)}</td></tr>`;
    });
    container.innerHTML = `<div class="table-wrap no-inner-scroll"><table class="data-table">${simpleTheadHtml(modeCfg.col1)}<tbody>${body}</tbody></table></div>`;
    bindSourceRowToggle();
    enableRowFocus();
    return;
  }

  // ===== Geo → Campaign: drill, parent row = name only (no numbers), children as nested stacked sections =====
  if(modeCfg.key === 'geocamp'){
    const sortedRows = rows.slice().sort((a,b)=>b.m.spend-a.m.spend);
    const rowRenderer = r => {
      const safeId = 'gc_'+r.label.replace(/[^a-zA-Z0-9]/g,'_');
      return `<tr class="source-row hotel-header-row" data-row="${safeId}"><td colspan="15"><span style="display:inline-block;width:14px;color:#3D5AFE;">▸</span><strong>${r.label}</strong></td></tr>` +
             `<tr data-parent="${safeId}" style="display:none;"><td colspan="15" style="padding:18px 24px 18px 36px;">${buildNestedObjectiveSections(r.children)}</td></tr>`;
    };
    container.innerHTML = renderRankedList('geocamp', sortedRows, {
      theadHtml: simpleTheadHtml(modeCfg.col1), colLabel:'GEO', rowRenderer, grandTotalRowHtml: ''
    });
    computeRankedBody('geocamp');
    bindSourceRowToggle();
    enableRowFocus();
    return;
  }

  // ===== Hotel → Geo: drill (unchanged children), Grand Total row appended at bottom =====
  if(modeCfg.key === 'hotelgeo'){
    const sortedRows = rows.slice().sort((a,b)=>b.m.spend-a.m.spend);
    const donutsHtml = donutRowHtml([
      {id:'donutHotelSpend', title:'SPEND BY HOTEL'},
      {id:'donutHotelRevenue', title:'REVENUE BY HOTEL'}
    ]);
    let body = '';
    sortedRows.forEach((r,ri)=>{
      body += `<tr class="source-row" data-row="${ri}"><td><strong><span style="display:inline-block;width:14px;color:#3D5AFE;">▸</span>${r.label}</strong></td>${rowCellsGlobal(r.m)}</tr>`;
      r.children.filter(ch=>ch.m.spend>0).sort((a,b)=>b.m.spend-a.m.spend).forEach(ch=>{
        body += `<tr data-parent="${ri}" style="display:none;"><td style="padding-left:36px;">${ch.label}</td>${rowCellsGlobal(ch.m)}</tr>`;
      });
    });
    const total = sumMetrics(rows.map(r=>r.m));
    body += `<tr class="grandtotal-row"><td><strong>Grand Total</strong></td>${rowCellsGlobal(total)}</tr>`;
    container.innerHTML = donutsHtml + `<div class="table-wrap no-inner-scroll"><table class="data-table">${theadHtml(modeCfg.col1)}<tbody>${body}</tbody></table></div>`;

    renderDonut('donutHotelSpend', sortedRows.map(r=>({label:r.label, value:r.m.spend})), fmtMoney);
    renderDonut('donutHotelRevenue', sortedRows.map(r=>({label:r.label, value:r.m.revenue})), fmtMoney);

    bindSourceRowToggle();
    enableRowFocus(container);
    return;
  }
}

function csvEscape(text){
  text = text.trim().replace(/\s+/g,' ');
  if(text.includes(',') || text.includes('"') || text.includes('\n')){
    text = '"'+text.replace(/"/g,'""')+'"';
  }
  return text;
}

function exportCurrentViewCSV(){
  const tables = document.querySelectorAll('#tableContainer table');
  if(!tables.length) return;
  const lines = [];
  tables.forEach(table=>{
    table.querySelectorAll('tr').forEach(tr=>{
      const cells = Array.from(tr.querySelectorAll('th,td'));
      lines.push(cells.map(td=>csvEscape(td.innerText)).join(','));
    });
    lines.push('');
  });

  const csvContent = '\uFEFF' + lines.join('\n');
  const blob = new Blob([csvContent], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const modeCfg = modes.find(m=>m.key===currentMode);
  const hotelPart = currentHotelFilter!=='all' ? '_'+currentHotelFilter.replace(/\s+/g,'-') : '';
  const filename = `AdsBI_${currentDest}${hotelPart}_${modeCfg.label.replace(/\s+/g,'-')}.csv`;

  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/** Builds "Overview by Month" + "Branding by Month" + "Conversion by Month" — the shared 3-block layout used by both the Campaign-overview and Hotel-searched views. */
function buildMonthlyOverviewWithSplit(hotels){
  const overviewRows = aggByMonthGeneric(hotels).filter(r=>r.m.spend>0);
  const total = sumMetrics(overviewRows.map(r=>r.m));
  let sec1Body = overviewRows.map(r=>`<tr><td><strong>${r.label}</strong></td>${rowCellsGlobal(r.m)}</tr>`).join('');
  sec1Body += `<tr class="grandtotal-row"><td><strong>Grand Total</strong></td>${rowCellsGlobal(total)}</tr>`;
  const sec1Html = `<div class="table-wrap no-inner-scroll"><table class="data-table">${theadHtml('Month')}<tbody>${sec1Body}</tbody></table></div>`;

  const brandingRows = aggByMonthGeneric(hotels, c=>c.objective==='Branding').filter(r=>r.m.spend>0);
  const brandingTotal = sumMetrics(brandingRows.map(r=>r.m));
  let sec2Body = brandingRows.map(r=>`<tr><td><strong>${r.label}</strong></td>${rowCellsGlobal(r.m)}</tr>`).join('');
  sec2Body += `<tr class="grandtotal-row"><td><strong>Grand Total</strong></td>${rowCellsGlobal(brandingTotal)}</tr>`;
  const sec2Html = `<div class="section-title">BRANDING BY MONTH</div><div class="table-wrap no-inner-scroll"><table class="data-table">${theadHtml('Month')}<tbody>${sec2Body}</tbody></table></div>`;

  const conversionRows = aggByMonthGeneric(hotels, c=>c.objective==='Conversion').filter(r=>r.m.spend>0);
  const conversionTotal = sumMetrics(conversionRows.map(r=>r.m));
  let sec3Body = conversionRows.map(r=>`<tr><td><strong>${r.label}</strong></td>${rowCellsGlobal(r.m)}</tr>`).join('');
  sec3Body += `<tr class="grandtotal-row"><td><strong>Grand Total</strong></td>${rowCellsGlobal(conversionTotal)}</tr>`;

}

function bindSourceRowToggle(){
  const container = document.getElementById('tableContainer');
  container.onclick = (e)=>{
    const row = e.target.closest('tr.source-row');
    if(!row) return;
    const idx = row.dataset.row;
    const caretSpan = row.querySelector('span');
    const isOpen = caretSpan.textContent === '▾';
    caretSpan.textContent = isOpen ? '▸' : '▾';
    container.querySelectorAll(`tr[data-parent="${idx}"]`).forEach(r=>{ r.style.display = isOpen ? 'none' : 'table-row'; });
  };
}

// Click a data row to focus it (dims every other row in that same table so you
// can pick one out of a long list). Click it again, or click elsewhere, to
// clear. Uses delegation on the stable #tableContainer so it keeps working
// even when inner tables get rebuilt (search, view-all, mode switches, etc.)
// — set up once, not re-attached per render.
let rowFocusDelegationReady = false;
function enableRowFocus(){
  if(rowFocusDelegationReady) return;
  rowFocusDelegationReady = true;
  const container = document.getElementById('tableContainer');
  container.addEventListener('click', (e)=>{
    const tr = e.target.closest('tbody tr');
    if(!tr) return;
    if(tr.classList.contains('source-row')) return;    // accordion rows: let bindSourceRowToggle handle the click
    if(tr.classList.contains('grandtotal-row')) return; // never dim/focus the total row
    const table = tr.closest('table');
    if(!table) return;
    const wasFocused = tr.classList.contains('row-focused');
    table.querySelectorAll('tr').forEach(r=>{ r.classList.remove('row-focused','row-dimmed'); });
    if(!wasFocused){
      tr.classList.add('row-focused');
      table.querySelectorAll('tbody tr').forEach(r=>{ if(r!==tr && !r.classList.contains('grandtotal-row')) r.classList.add('row-dimmed'); });
    }
  });
}

let compareDebounceTimer=null;
function scheduleCompareRender(){

  compareDebounceTimer = setTimeout(runCompare, 200);

function runCompare(){
  const modeCfg = modes.find(m=>m.key===currentMode);
  if(modeCfg.key!=='hotelcamp' && modeCfg.key!=='hotelgeo') return;
  const isCamp = modeCfg.key==='hotelcamp';
  const dim = document.getElementById('compareDimension').value;

  const names = [1,2,3,4,5].map(i=>{
    const el = document.getElementById('compareHotel'+i);
    return el ? el.value.trim() : '';
  }).filter(v=>v.length);
  const uniqueNames = [...new Set(names)];

  const empty = document.getElementById('compareEmpty');
  const output = document.getElementById('compareOutputWrap');

  if(!dim){
    empty.style.display='block';
    empty.textContent = isCamp ? 'Select a Campaign above to compare.' : 'Select a GEO above to compare.';
    output.style.display='none';
    if(charts['compareTrendChart']){ charts['compareTrendChart'].destroy(); delete charts['compareTrendChart']; }
    return;
  }

  if(uniqueNames.length < 2){
    empty.style.display='block';
    empty.textContent='Select at least 2 hotels above to compare.';
    output.style.display='none';
    if(charts['compareTrendChart']){ charts['compareTrendChart'].destroy(); delete charts['compareTrendChart']; }
    return;
  }

  const hotelRows = isCamp ? aggByHotelCampaign(currentDest) : aggByHotelGeo(currentDest);
  const found = uniqueNames.map(name=>{
    const hRow = hotelRows.find(h=>h.label.toLowerCase()===name.toLowerCase());
    if(!hRow) return null;
    const childRow = (hRow.children||[]).find(c=>c.label.toLowerCase()===dim.toLowerCase());
    return childRow ? {label:hRow.label, m:childRow.m} : {label:hRow.label, m:{spend:0,impr:0,clicks:0,conv:0,revenue:0}};
  });
  const missing = uniqueNames.filter((n,i)=>!found[i]);
  if(missing.length){
    empty.style.display='block';
    empty.textContent='No data found for: '+missing.join(', ');
    output.style.display='none';
    if(charts['compareTrendChart']){ charts['compareTrendChart'].destroy(); delete charts['compareTrendChart']; }
    return;
  }

  empty.style.display='none';
  output.style.display='block';

  const metricDefs = [
    {key:'spend', label:'Ad Spend', fmt:v=>fmtMoney(v), get:(m,r)=>m.spend, lowerBetter:false},
    {key:'impr', label:'Impressions', fmt:v=>fmtNum(v), get:(m,r)=>m.impr, lowerBetter:false},
    {key:'cpm', label:'CPM', fmt:v=>fmtMoneyDecimal(v), get:(m,r)=>r.cpm, lowerBetter:true},
    {key:'clicks', label:'Clicks', fmt:v=>fmtNum(v), get:(m,r)=>m.clicks, lowerBetter:false},
    {key:'cpc', label:'CPC', fmt:v=>fmtMoneyDecimal(v), get:(m,r)=>r.cpc, lowerBetter:true},
    {key:'ctr', label:'CTR', fmt:v=>fmtPercent2(v), get:(m,r)=>r.ctr, lowerBetter:false},
    {key:'videoViews', label:'VDO VIEWS', fmt:v=>fmtNum(v), get:(m,r)=>m.videoViews||0, lowerBetter:false},
    {key:'completedViews', label:'COMP. VIEWS', fmt:v=>fmtNum(v), get:(m,r)=>m.completedViews||0, lowerBetter:false},
    {key:'conv', label:'Conversions', fmt:v=>fmtNum(v), get:(m,r)=>m.conv, lowerBetter:false},
    {key:'cpa', label:'CPA', fmt:v=>fmtMoneyDecimal(v), get:(m,r)=>r.cpa, lowerBetter:true},
    {key:'cvr', label:'CVR', fmt:v=>fmtPercent2(v), get:(m,r)=>r.cvr, lowerBetter:false},
    {key:'abv', label:'ABV', fmt:v=>fmtMoney(v), get:(m,r)=>r.abv, lowerBetter:false},
    {key:'revenue', label:'Revenue', fmt:v=>fmtMoney(v), get:(m,r)=>m.revenue, lowerBetter:false},
    {key:'roas', label:'ROAS', fmt:v=>fmtRatio2(v), get:(m,r)=>r.roas, lowerBetter:false},
  ];

  const computed = found.map(f=>({label:f.label, rates:deriveRates(f.m), m:f.m}));
  const bestByMetric = {};
  metricDefs.forEach(md=>{
    const vals = computed.map(c=>md.get(c.m, c.rates));
    bestByMetric[md.key] = md.lowerBetter ? Math.min(...vals) : Math.max(...vals);
  });

  const thead = `<thead><tr><th>${isCamp?'Campaign':'GEO'}: ${dim}</th>${metricDefs.map(m=>`<th class="money">${m.label}</th>`).join('')}</tr></thead>`;
  const tbody = '<tbody>' + computed.map(c=>{
    const cells = metricDefs.map(md=>{
      const v = md.get(c.m, c.rates);
      const isBest = v === bestByMetric[md.key] && v>0;
      return `<td class="money${isBest?' compare-best':''}">${md.fmt(v)}</td>`;
    }).join('');
    return `<tr><td><strong>${c.label}</strong></td>${cells}</tr>`;
  }).join('') + '</tbody>';

  document.getElementById('compareMetricsTable').innerHTML = colgroupHtml + thead + tbody;
  renderCompareChart(computed);
}

function monthsInRange(start, end){
  const months = [];
  let cursor = new Date(start.getFullYear(), start.getMonth(), 1);
  const endCursor = new Date(end.getFullYear(), end.getMonth(), 1);
  let guard = 0;
  while(cursor <= endCursor && guard < 36){
    months.push({ short: cursor.toLocaleString('en-US',{month:'short'}), year: cursor.getFullYear() });
    cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);
    guard++;
  }
  if(months.length===0){
    months.push({ short: start.toLocaleString('en-US',{month:'short'}), year: start.getFullYear() });
  }
  return months;
}

function seededRand(str, i){
  let h=0; for(let k=0;k<str.length;k++){ h = (h*31 + str.charCodeAt(k) + i*97) % 100000; }
  return (h % 1000) / 1000;
}
function monthlyRevenueSeries(label, totalRevenue, monthCount){
  const weights = [];
  for(let i=0;i<monthCount;i++){ weights.push(0.6 + seededRand(label, i)*0.8); }
  const sum = weights.reduce((a,b)=>a+b,0);
  return weights.map(w => (w/sum) * totalRevenue);
}

function fmtCompact(n){
  const v = currentCurrency==='USD' ? n/EXCHANGE_RATE_USD : n;
  const symbol = currentCurrency==='USD' ? '$' : '฿';
  if(v>=1000000) return symbol+(v/1000000).toFixed(1)+'M';
  if(v>=1000) return symbol+(v/1000).toFixed(0)+'K';
  return symbol+Math.round(v);
}

const charts = {};
function createChart(id, config){

}

const DONUT_COLORS = ['#3D5AFE','#1AAB40','#D64550','#744EC2','#197278','#E9A23B','#7b8798','#0EA5E9','#DB2777','#a8a29e','#F97316','#14B8A6'];

/** rows: [{label, value}] — renders a doughnut chart into <canvas id="canvasId">. */
function renderDonut(canvasId, rows, formatFn){
  const filtered = rows.filter(r=>r.value>0);
  const total = filtered.reduce((a,r)=>a+r.value,0);
  createChart(canvasId, {
    type: 'doughnut',
    data: {
      labels: filtered.map(r=>r.label),
      datasets: [{
        data: filtered.map(r=>r.value),
        backgroundColor: filtered.map((_,i)=>DONUT_COLORS[i%DONUT_COLORS.length]),
        borderWidth: 2, borderColor: '#fff'
      }]
    },
    plugins: (typeof ChartDataLabels !== 'undefined') ? [ChartDataLabels] : [],
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'right', labels: { boxWidth: 10, font: { size: 11 }, usePointStyle: true, pointStyle: 'circle' } },
        tooltip: { callbacks: { label: (ctx)=>{
          const pct = total ? (ctx.parsed/total*100).toFixed(1) : '0.0';
          return ` ${ctx.label}: ${formatFn ? formatFn(ctx.parsed) : ctx.parsed} (${pct}%)`;
        } } },
        datalabels: {
          color: '#fff',
          font: { size: 11, weight: 700 },
          formatter: (value)=>{
            const pct = total ? (value/total*100) : 0;
            return pct < 4 ? '' : pct.toFixed(1)+'%'; // hide labels on slivers too small to read
          }
        }
      }
    }
  });
}

/** Returns the HTML for a row of N donut-chart cards. Call renderDonut() for each canvasId right after inserting this HTML into the DOM. */
function donutRowHtml(cards){
  return `<div style="display:grid;grid-template-columns:repeat(${cards.length},1fr);gap:14px;margin-bottom:16px;">` +
    cards.map(c=>`<div class="summary-card" style="padding:14px;">
        <div class="summary-label">${c.title}</div>
        <div style="height:230px;"><canvas id="${c.id}"></canvas></div>
      </div>`).join('') +
    `</div>`;
}

function renderCompareChart(computed){
  const colors = ['#3D5AFE','#1AAB40','#D64550','#744EC2','#197278'];
  const monthsArr = monthsInRange(dateRangeStart, dateRangeEnd);
  const labels = monthsArr.map(m => m.short+' '+m.year);

  const titleEl = document.getElementById('compareChartTitle');
  if(titleEl){
    titleEl.textContent = labels.length>1
      ? `REVENUE TREND (${labels[0]} – ${labels[labels.length-1]})`
      : `REVENUE TREND (${labels[0]})`;
  }

  const datasets = computed.map((c,i)=>{
    const color = colors[i % colors.length];
    return {
      label: c.label,
      data: monthlyRevenueSeries(c.label, c.m.revenue, monthsArr.length),
      borderColor: color,
      backgroundColor: color+'1A',
      fill: false,
      tension: .35,
      pointRadius: 3,
      pointBackgroundColor: '#fff',
      pointBorderColor: color,
      pointBorderWidth: 2,
      borderWidth: 2.3
    };
  });

  const opts = {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display:true, position:'top', labels:{ boxWidth:10, usePointStyle:true, font:{size:11}, color:'#374151' } },
      tooltip: {
        backgroundColor:'#111827', titleColor:'#fff', bodyColor:'#e5edff', padding:12, cornerRadius:12, displayColors:false,
        callbacks:{ label:function(c){ return c.dataset.label+': '+fmtCompact(c.raw); } }
      }
    },
    scales: {
      x: { grid:{display:false}, border:{display:false}, ticks:{color:'#66748d'} },
      y: { grid:{color:'rgba(16,33,63,.05)'}, border:{display:false}, ticks:{color:'#66748d', callback:function(v){ return fmtCompact(v); }} }
    }
  };

  createChart('compareTrendChart', { type:'line', data:{ labels:labels, datasets:datasets }, options:opts });
}

  const container = document.getElementById('tableContainer');
  container.innerHTML = `<div style="padding:60px 20px;text-align:center;color:#8a96aa;">Loading data from the Sheet…</div>`;

  if(!SHEET_API_URL || SHEET_API_URL === "PASTE_YOUR_WEB_APP_URL_HERE"){
    container.innerHTML = `<div style="padding:40px 20px;text-align:center;color:#8a96aa;">
      <strong>Not connected yet.</strong><br>
      Paste your deployed Apps Script Web App URL into the <code>SHEET_API_URL</code> constant near the top of the script.
    </div>`;
    return;
  }

  try{
    await loadRealData();
    const noAdsData = !rawData['All Destinations'] || rawData['All Destinations'].hotels.length === 0;
    const noGeoData = !geoRawData['All Destinations'] || geoRawData['All Destinations'].hotels.length === 0;
    if(noAdsData && noGeoData) throw new Error('The Sheet returned no rows. Run "Ads BI > Run Parse & Aggregate" at least once first.');
    currentDest = 'All Destinations';
    populateDestSelect();
    populateHotelFilter();

    container.innerHTML = `<div style="padding:40px 20px;text-align:center;color:#8a96aa;">
      <strong>Couldn't load data.</strong><br>${err.message}<br><br>
      Confirm that you are signed in with a <code>media-console.com</code> Google account, then refresh the page.
    </div>`;
  }
}
