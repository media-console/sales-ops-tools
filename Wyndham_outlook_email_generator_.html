let mockupData = "";
let coverData = "";
let trustedData = "";

function esc(s){
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function nl2br(str){
  return esc(str).replace(/\n/g,'<br>');
}

function readFile(input, callback, targetWidth){
  const file = input.files && input.files[0];
  if(!file){ callback(""); return; }

  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const finalWidth = targetWidth || img.width;
      const scale = finalWidth / img.width;
      const finalHeight = Math.round(img.height * scale);

      const canvas = document.createElement('canvas');
      canvas.width = finalWidth;
      canvas.height = finalHeight;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, finalWidth, finalHeight);

      // JPEG keeps the pasted email lighter and helps Outlook Mobile treat the image as a real large image.
      callback(canvas.toDataURL('image/jpeg', 0.92));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function generateEmail(){

  // Keep GIF animation for mockup image by NOT resizing through canvas.
  const mockupInput = document.getElementById('mockupFile');
  const mockupFile = mockupInput.files && mockupInput.files[0];

  if(mockupFile){
    const mockupReader = new FileReader();
    mockupReader.onload = function(e){
      mockupData = e.target.result;

      // Resize cover/trusted images for Outlook Mobile responsiveness.
      readFile(document.getElementById('coverFile'), function(c){
        coverData = c || coverData;

        readFile(document.getElementById('trustedFile'), function(t){
          trustedData = t || trustedData;
          renderEmail();
        }, 1136);

      }, 1136);

    };
    mockupReader.readAsDataURL(mockupFile);

  } else {

    readFile(document.getElementById('coverFile'), function(c){
      coverData = c || coverData;

      readFile(document.getElementById('trustedFile'), function(t){
        trustedData = t || trustedData;
        renderEmail();
      }, 1136);

    }, 1136);

  }
}

function copyEmail(){
  const el = document.getElementById('emailPreview');
  const range = document.createRange();
  range.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  document.execCommand('copy');
  sel.removeAllRanges();
  alert('Copied. Paste into Outlook compose.');
}

function safeFilename(value){
  return String(value || 'wyndham-property')
    .trim()
    .replace(/[^a-z0-9-_]+/gi,'-')
    .replace(/^-+|-+$/g,'')
    .toLowerCase() || 'wyndham-property';
}

function saveJSON(){
  try{
    const data = {
      version: 1,
      savedAt: new Date().toISOString(),
      hotelName: document.getElementById('hotelName').value,
      previewLink: document.getElementById('previewLink').value,
      deckLink: document.getElementById('deckLink').value,
      senderSignature: document.getElementById('senderSignature').value,
      images: {
        mockupData,
        coverData,
        trustedData
      }
    };

    const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = safeFilename(data.hotelName) + '-wyndham-outreach-email.json';
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
    alert('JSON saved with all email details and images.');
  }catch(error){
    alert('Unable to save JSON: ' + error.message);
  }
}

function loadJSON(event){
  const file = event.target.files && event.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      if(!data || typeof data !== 'object') throw new Error('Invalid JSON format.');

      ['hotelName','previewLink','deckLink','senderSignature'].forEach(function(id){
        if(data[id] !== undefined) document.getElementById(id).value = data[id];
      });

      const images = data.images && typeof data.images === 'object' ? data.images : data;
      if(typeof images.mockupData === 'string') mockupData = images.mockupData;
      if(typeof images.coverData === 'string') coverData = images.coverData;
      if(typeof images.trustedData === 'string') trustedData = images.trustedData;

      renderEmail();
      alert('JSON loaded with all email details and images.');
    }catch(error){
      alert('Unable to load JSON: ' + error.message);
    }finally{
      event.target.value = '';
    }
  };
  reader.onerror = function(){
    alert('Unable to read the selected JSON file.');
    event.target.value = '';
  };
  reader.readAsText(file);
}

renderEmail();
