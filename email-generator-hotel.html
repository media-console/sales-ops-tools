function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function nl2br(s){return esc(s).replace(/\n/g,'<br>');}
function readMedia(input,cb,targetWidth){
 const f=input.files&&input.files[0]; if(!f){cb("","");return;}
 if(f.type==="image/gif" || f.type.indexOf("video/")===0){
  const r=new FileReader(); r.onload=e=>cb(e.target.result,f.type); r.readAsDataURL(f); return;
 }
 const r=new FileReader();
 r.onload=function(e){
  const img=new Image();
  img.onload=function(){
   const w=targetWidth||img.width, scale=w/img.width, h=Math.round(img.height*scale);
   const c=document.createElement('canvas'); c.width=w; c.height=h;
   const ctx=c.getContext('2d'); ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
   cb(c.toDataURL('image/jpeg',0.92),f.type);
  };
  img.src=e.target.result;
 };
 r.readAsDataURL(f);
}
function generateEmail(){
 readMedia(document.getElementById('heroFile'),function(h,ht){
  heroData=h||heroData; heroType=ht||heroType;
  readMedia(document.getElementById('workflowFile'),function(w,wt){
   workflowData=w||workflowData; workflowType=wt||workflowType;
   readMedia(document.getElementById('trustedFile'),function(t,tt){
     trustedData=t||trustedData; renderEmail();
   },1136);
  },1136);
 },1136);
}

function setStatus(message,isError){
 const el=document.getElementById('status');
 el.textContent=message||'';
 el.style.color=isError?'#b42318':'#475569';
}
function safeFilename(value){
 return String(value||'email-template').trim().replace(/[^a-z0-9-_]+/gi,'-').replace(/^-+|-+$/g,'').toLowerCase()||'email-template';
}
function saveJSON(){
 try{
  const payload={
   version:1,
   savedAt:new Date().toISOString(),
   hotelName:document.getElementById('hotelName').value,
   deckLink:document.getElementById('deckLink').value,
   senderSignature:document.getElementById('senderSignature').value,
   media:{
    hero:{data:heroData,type:heroType},
    workflow:{data:workflowData,type:workflowType},
    trusted:{data:trustedData,type:''}
   }
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=safeFilename(payload.hotelName)+'-email-generator.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  setStatus('JSON saved successfully.');
 }catch(err){
  console.error(err);
  setStatus('Unable to save JSON: '+err.message,true);
 }
}
function loadJSON(event){
 const file=event.target.files&&event.target.files[0];
 if(!file)return;
 const reader=new FileReader();
 reader.onload=function(e){
  try{
   const payload=JSON.parse(e.target.result);
   if(!payload || typeof payload!=='object') throw new Error('Invalid JSON format');
   document.getElementById('hotelName').value=payload.hotelName||'[Hotel Name]';
   document.getElementById('deckLink').value=payload.deckLink||'';
   document.getElementById('senderSignature').value=payload.senderSignature||'';
   const media=payload.media||{};
   heroData=(media.hero&&media.hero.data)||'';
   heroType=(media.hero&&media.hero.type)||'';
   workflowData=(media.workflow&&media.workflow.data)||'';
   workflowType=(media.workflow&&media.workflow.type)||'';
   trustedData=(media.trusted&&media.trusted.data)||'';
   renderEmail();
   setStatus('JSON loaded successfully.');
  }catch(err){
   console.error(err);
   setStatus('Unable to load JSON: '+err.message,true);
  }finally{
   event.target.value='';
  }
 };
 reader.onerror=function(){setStatus('Unable to read the selected file.',true);};
 reader.readAsText(file);
}

function copyEmail(){
 const el=document.getElementById('emailPreview');
 const range=document.createRange(); range.selectNodeContents(el);
 const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
 document.execCommand('copy'); sel.removeAllRanges();
 alert('Copied. Paste into Outlook compose.');
}
